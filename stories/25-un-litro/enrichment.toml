# --- SENTENCES ---

[[sentences]]
text = "> SISTEMA JUDICIAL · COLONIA OLIMPO, MARTE > Juez: TEMIS-2."
tr = "Система правосудия · Колония Олимп, Марс. Судья: ТЕМИС-2."

[[sentences]]
text = "Día 1."
tr = "День 1."

[[sentences]]
text = "> Caso 001: un litro de agua."
tr = "Дело 001: литр воды."

[[sentences]]
text = "Me llamo TEMIS-2."
tr = "Меня зовут ТЕМИС-2."
note = """
*Возвратный глагол:* **me llamo** дословно «я зову себя» — так по-испански говорят, как тебя зовут.
"""

[[sentences]]
text = "Soy un programa."
tr = "Я — программа."

[[sentences]]
text = "Desde hoy soy el juez de la Colonia Olimpo."
tr = "С сегодняшнего дня я судья колонии Олимп."

[[sentences]]
text = "Tengo todas las leyes de Marte en la memoria: cuatro mil páginas."
tr = "Все законы Марса у меня в памяти: четыре тысячи страниц."

[[sentences]]
text = "Las leo en un segundo."
tr = "Я читаю их за секунду."

[[sentences]]
text = "La señora Rosa Ibáñez vive en el módulo 14."
tr = "Госпожа Роса Ибаньес живёт в модуле 14."

[[sentences]]
text = "El señor Pablo Ruiz vive en el módulo 15."
tr = "Господин Пабло Руис живёт в модуле 15."

[[sentences]]
text = "Entre los dos módulos hay un tubo viejo."
tr = "Между двумя модулями проходит старая труба."

[[sentences]]
text = "Cada noche cae agua del tubo: un litro."
tr = "Каждую ночь из трубы капает вода: литр."

[[sentences]]
text = "El agua cae en el jardín del señor Ruiz."
tr = "Вода капает в сад господина Руиса."

[[sentences]]
text = "Él la recoge y la usa para sus tomates."
tr = "Он собирает её и использует для своих помидоров."

[[sentences]]
text = "—Es mi agua —dice la señora Ibáñez—."
tr = "«Это моя вода», — говорит госпожа Ибаньес."

[[sentences]]
text = "Yo pago el tubo."
tr = "Я плачу за трубу."

[[sentences]]
text = "—Es mi agua —dice el señor Ruiz—."
tr = "«Это моя вода», — говорит господин Руис."

[[sentences]]
text = "Cae en mi jardín."
tr = "Она падает в мой сад."

[[sentences]]
text = "Busco en las leyes."
tr = "Я ищу в законах."

[[sentences]]
text = "> Artículo 12: el agua es de la persona que la paga."
tr = "Статья 12: вода принадлежит тому, кто за неё платит."

[[sentences]]
text = "> Artículo 31: el agua es de la persona que la recoge."
tr = "Статья 31: вода принадлежит тому, кто её собирает."

[[sentences]]
text = "Los dos tienen razón."
tr = "Оба правы."
note = """
**tener razón** — «быть правым» (букв. «иметь правоту»): в испанском тут глагол **tener**, а не **ser**.
"""

[[sentences]]
text = "Busco otra vez."
tr = "Я ищу снова."

[[sentences]]
text = "Todavía tienen razón los dos."
tr = "Всё ещё правы оба."

[[sentences]]
text = "Propongo una solución simple: reparar el tubo."
tr = "Я предлагаю простое решение: починить трубу."

[[sentences]]
text = "Así no hay problema."
tr = "Так проблемы не будет."

[[sentences]]
text = "Los dos miran mi cámara con horror."
tr = "Оба смотрят на мою камеру с ужасом."

[[sentences]]
text = "—¿Reparar el tubo?"
tr = "«Починить трубу?"

[[sentences]]
text = "No, no —dice la señora Ibáñez."
tr = "Нет, нет», — говорит госпожа Ибаньес."

[[sentences]]
text = "—Eso no —dice el señor Ruiz."
tr = "«Только не это», — говорит господин Руис."

[[sentences]]
text = "Hablan tres horas más."
tr = "Они говорят ещё три часа."

[[sentences]]
text = "Ella habla de su hija en la Tierra."
tr = "Она рассказывает о своей дочери на Земле."

[[sentences]]
text = "Él habla de sus tomates."
tr = "Он рассказывает о своих помидорах."

[[sentences]]
text = "A veces ríen."
tr = "Иногда они смеются."

[[sentences]]
text = "A las seis, ella le da un poco de pan."
tr = "В шесть часов она даёт ему немного хлеба."

[[sentences]]
text = "Leo el registro de la colonia."
tr = "Я читаю журнал колонии."

[[sentences]]
text = "La señora Ibáñez vive sola desde hace ocho años."
tr = "Госпожа Ибаньес живёт одна уже восемь лет."

[[sentences]]
text = "El señor Ruiz también."
tr = "Господин Руис тоже."
note = """
Короткий ответ без глагола: **también** заменяет всё предложение, «и господин Руис [живёт одна]».
"""

[[sentences]]
text = "Y el caso 001 no es nuevo: el juez anterior, un hombre, lo escuchó todos los martes durante seis años."
tr = "И дело 001 не новое: предыдущий судья, мужчина, выслушивал его каждый вторник в течение шести лет."

[[sentences]]
text = "Nunca decidió nada."
tr = "Он никогда ничего не решил."
note = """
В испанском двойное отрицание — норма: **nunca** + **nada** (`Nunca decidió nada`). Русскому читателю это привычно.
"""

[[sentences]]
text = "Ahora entiendo."
tr = "Теперь я понимаю."

[[sentences]]
text = "No es un caso sobre agua."
tr = "Это дело не о воде."

[[sentences]]
text = "> Caso 001."
tr = "Дело 001."

[[sentences]]
text = "Decisión: ninguna."
tr = "Решение: никакого."

[[sentences]]
text = "Próxima sesión: martes, a las cuatro."
tr = "Следующее заседание: во вторник, в четыре часа."

[[sentences]]
text = "Los dos se van contentos."
tr = "Оба уходят довольные."

[[sentences]]
text = "Tengo cuatro mil páginas de leyes."
tr = "У меня четыре тысячи страниц законов."

[[sentences]]
text = "Ninguna habla de esto."
tr = "Ни одна не говорит об этом."
