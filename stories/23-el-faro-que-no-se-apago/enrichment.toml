[[sentences]]
text = "Ir hasta el faro cuesta once días y mucho combustible."
tr = "Долететь до маяка стоит одиннадцать дней и много топлива."

[[sentences]]
text = "El hielo se derrite despacio, pero se derrite."
tr = "Лёд тает медленно, но тает."

[[sentences]]
text = "La empresa cuenta los días."
tr = "Компания считает дни."

[[sentences]]
text = "Nadie cuenta las dudas."
tr = "Никто не считает сомнения."
note = """
Игра слов с предыдущей фразой: **cuenta los días** («считает дни») и **cuenta las dudas** («считает сомнения») — компания ведёт учёт срокам, но не тому, что чувствует человек.
"""

[[sentences]]
text = "Hace nueve años, Marco encontró una sonda vieja que todavía hablaba."
tr = "Девять лет назад Марко нашёл старый зонд, который всё ещё говорил."
note = """
**hablaba** — *pretérito imperfecto*: зонд не просто "заговорил" один раз, а всё ещё продолжал передавать сигнал, когда его нашли.
"""

[[sentences]]
text = "Escribió un reporte, marcó las coordenadas y siguió, porque una sonda no espera a nadie y eso fue fácil."
tr = "Он написал отчёт, отметил координаты и продолжил путь, потому что зонд никого не ждёт, и это было легко."
note = """
**eso fue fácil** — здесь **fue** от **ser** ("было"), не от **ir**: оценка ситуации ("это было легко"), а не движение.

Тон — сухая ирония: бросить безмолвный зонд оказалось "легко", в отличие от маяка, который всё ещё зовёт.
"""

[[sentences]]
text = "Ahora graba un mensaje corto."
tr = "Теперь он записывает короткое сообщение."

[[sentences]]
text = "La Tortuga va a repetirlo cada seis horas, en la frecuencia del faro: > Tortuga."
tr = "«Тортуга» будет повторять его каждые шесть часов, на частоте маяка: «Тортуга»."

[[sentences]]
text = "Yo te oigo."
tr = "Я тебя слышу."

[[sentences]]
