tr = "Потом он записывает отчёт и отмечает координаты."

[[sentences]]
text = "Otra misión, quizás, va a ir."
tr = "Может быть, полетит другая миссия."
note = """
**va a ir** — *futuro próximo* от **ir** ("собирается лететь"): вспомогательное **va** и смысловой инфинитив **ir** — тот же глагол дважды подряд, что для А1 выглядит непривычно.

Вместе со следующей фразой («O quizás no») предложение оставляет судьбу маяка открытой — как и весь рассказ.
"""

