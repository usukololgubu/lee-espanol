[[sentences]]
text = "Por eso Marco pasa por el corredor viejo, entre Ceres y Júpiter."
tr = "Поэтому Марко идёт по старому коридору, между Церерой и Юпитером."

[[sentences]]
text = "Aquí no hay tráfico."
tr = "Здесь нет движения."

[[sentences]]
text = "Aquí nadie lo apura."
tr = "Здесь никто его не торопит."

[[sentences]]
text = "*— corredor viejo · día 3 —* El receptor oye algo."
tr = "— старый коридор · день 3 — Приёмник слышит что-то."
note = """
Курсивная строка перед точкой — это пометка-заголовок (место и день), как запись в судовом журнале, а не полноценное предложение; она просто предшествует следующему.
"""

[[sentences]]
text = "Cada seis horas, siempre lo mismo: > Faro Vesta-7."
tr = "Каждые шесть часов — всегда одно и то же: «Маяк Веста-7»."

[[sentences]]
text = "Aquí estoy."
tr = "Я здесь."

[[sentences]]
text = "Cuidado con la órbita."
tr = "Осторожно, орбита."

[[sentences]]
text = "Marco busca en el registro de la nave."
tr = "Марко ищет в судовом журнале."

[[sentences]]
text = "> FARO VESTA-7: CERRADO."
