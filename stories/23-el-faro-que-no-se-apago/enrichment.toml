tr = "Оператор эвакуирована."

[[sentences]]
text = "Cerrado."
tr = "Закрыто."

[[sentences]]
text = "Nadie vive allí."
tr = "Там никто не живёт."

[[sentences]]
text = "Pero la señal sale cada seis horas."
tr = "Но сигнал выходит каждые шесть часов."

[[sentences]]
text = "Marco piensa."
tr = "Марко думает."

[[sentences]]
text = "Tal vez la antena quedó encendida y habla sola, como una máquina vieja que nadie apagó."
tr = "Может быть, антенна осталась включённой и говорит сама, как старая машина, которую никто не выключил."

